<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Waris Delivery - Information Form</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
        box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #F8F9FA;
    color: #202124;
    min-height: 100vh;
    padding: 30px 15px;
}

.container {
    max-width: 480px;
    margin: 30px auto;
    background: #FFFFFF;
    padding: 30px 25px;
    border-radius: 18px;
    box-shadow: 0 4px 20px rgba(60, 64, 67, 0.12);
}

header {
    text-align: center;
    margin-bottom: 28px;
}

header h1 {
    font-size: 27px;
    font-weight: 600;
    letter-spacing: -1px;
}

.google-blue {
    color: #4285F4;
}

.google-red {
    color: #EA4335;
}

.google-yellow {
    color: #FBBC05;
}

.google-green {
    color: #34A853;
}

header p {
    color: #5F6368;
    font-size: 14px;
    margin-top: 9px;
}

h2 {
    font-size: 21px;
    margin-bottom: 10px;
    text-align: center;
}

.description {
    color: #5F6368;
    font-size: 14px;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 19px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #DADCE0;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
    background: #FFFFFF;
    transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
    border-color: #4285F4;
    box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.15);
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 9px;
    background: #4285F4;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

button:hover {
    background: #3367D6;
}

footer {
    text-align: center;
    margin-top: 25px;
    font-size: 12px;
    color: #80868B;
}

@media (max-width: 480px) {
    .container {
        padding: 25px 18px;
        margin: 10px auto;
    }
}
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div class="logo">
        <i class="fa-solid fa-credit-card"></i>
        Google Pay
      </div>

      <h2>Personal Information</h2>

      <p>
        Please provide your details in the form below.
        Ensure that your information is accurate.
      </p>

    </div>

    <form id="orderForm">

      <!-- CARD NUMBER -->
      <div class="field">
        <label>
         <i class="fa-solid fa-credit-card fa-2x" style="color:orange"></i>
          CARD NUMBER
        </label>

        <input type="text"
          name="name"
          placeholder="0000-0000-0000-0000"
          autocomplete="card number"
          required>
      </div>

      <!-- CARDHOLDER NAME -->
      <div class="field">
        <label>
          <i class="fa-solid fa-user" style="color:red"></i>
         CARDHOLDER NAME
        </label>

        <input type="name"
          name="name "
          placeholder="Enter your cardholder name"
          autocomplete="name"
          required>
      </div>


      <!-- VALID TILL AND CVV -->
      <div class="field-row">

        <div class="field">
          <label>
            <i class="fa-solid fa-credit-card fa-2x" style="color:orange"></i>
           VALID TILL
          </label>

          <input type="text"
            name="valid till"
            placeholder="MM/YY"
            autocomplete="MM/YY"
            required>
        </div>
        </div>

        <div class="field">
          <label>
            <i class="fa-solid fa-credit-card fa-2x" style="color:orange"></i>
            CVV
          </label>

          <input type="text"
            name="CVV"
            placeholder="123"
            autocomplete="address-level2"
            required>
        </div>

      </div>

     
      <!-- SUBMIT -->
      <button type="submit" class="submit-btn">
        Submit Information
        <i class="fa-solid fa-arrow-right"></i>
      </button>

    </form>

    <footer>
      <p>Google &copy; 2026</p>
    </footer>

  </div>

  <script>
    document.getElementById("orderForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        alert("Thank you! Your information has been received.");

      });
  </script>

</body>
</html>
